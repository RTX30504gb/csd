services:
  postgres:
    image: postgres:16-alpine
    container_name: rug-postgres
    environment:
      POSTGRES_DB: rug
      POSTGRES_USER: rug
      POSTGRES_PASSWORD: rug
    ports:
      - "5432:5432"
    volumes:
      - rug_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rug -d rug"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rug-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rug_pg_data:
